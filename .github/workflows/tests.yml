name: fast-tests

on:
  push:
    paths:
      - "prompts/**"
      - "docs/**"
      - "config.py"
      - "chunker.py"
      - "golden.json"
      - "test_*.py"
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest test_chunker.py test_dataset.py -v